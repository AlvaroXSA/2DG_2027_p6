<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P6_Tarjeta</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #7ca782;
            font-family: 'Poppins', sans-serif;

            min-height: 100vh;
        }

        .tarjeta {
            display: flex;
            flex-direction: column;
            background-color: #FFFFFF;
            border-radius: 15px;
            overflow: hidden;

            width: 240px;
            height: 440px;       
        }

        .imagen {
            display: block;
            object-fit: cover;
            object-position: center;

            width: 100%;
            height: 195px;

           
        }

        .contenido {
            display: flex;
            flex-direction: column;

            padding: 10px;
            flex: 1;

           
        }

        .Titulo {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;

            margin-bottom: 3px;
            color: #000000;
        }

        .bajo-titulo {
            font-size: 11px;
            font-weight: 300;
            color: #888888;

            margin-bottom: 10px;
        }

        .descripcion {
            font-size: 10px;
            font-weight: 400;
            line-height: 1.25;

            color: #111111;
        }

        .bajo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;

            padding-bottom: 9px;
        }

        .precio {
            font-size: 14px;
            font-weight: 600;
            color: #000000;
        }


        .boton-comprar {
            background-color: #64D326;
            color: #000000;

            border: none;
            border-radius: 15px;

            padding: 10px 15px;

            font-family: 'Poppins', sans-serif;
            font-size: 10px;
            font-weight: 600;

            cursor: pointer;
        }

        .boton-comprar:hover {
            background-color: #58BE20;
        }

@media screen and (max-width: 600px) {

    .tarjeta {
        
        display: flex;
        flex-direction: column;
        
        width: 90%;
        max-width: 260px;
        height: 470px;

        
    }

    .imagen {
        
        object-fit: cover;
        object-position: center 45%;
        
        width: 100%;
        height: 210px;

        
    }

}

    </style>
</head>

<body>

    <div class="tarjeta">
        <img
    class="imagen"
    src="planta.png"
    alt="planta"
>
  
        <div class="contenido">

            <h2 class="Titulo">
                Harvert Vase
            </h2>

            <p class="bajo-titulo">
                by studio friends
            </p>

            <p class="descripcion">
                Lorem ipsum dolor sit amet, consectetur
                adipiscing elit. Sed do eiusmod tempor
                incididunt ut labore et dolore magna aliqua.
                Ut enim ad minim veniam, quis nostrud
                exercitation ullamco laboris.
            </p>
            
            <div class="bajo">

                <span class="precio">
                    78$
                </span>

                <button class="boton-comprar">
                    BUY NOW
                </button>

            </div>

        </div>

    </div>

</body>
</html>
